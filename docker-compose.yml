services:
  # FFmpeg Video API Service
  ffmpeg-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ffmpeg-video-api
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - REDIS_URL=redis://redis:6379
      - TEMP_DIR=/tmp/ffmpeg-api
    env_file:
      - .env
    volumes:
      # Persistent storage for uploads (if using local storage)
      - ./storage/uploads:/app/storage/uploads
      # Logs
      - ./logs:/app/logs
      # Temp files (optional, can use tmpfs for better performance)
      - ffmpeg_temp:/tmp/ffmpeg-api
    depends_on:
      - redis
    networks:
      - ffmpeg-network
      - ai-toolkit_v2_default  # Traefik network (if using Traefik)
    labels:
      # Traefik configuration (optional - uncomment and configure if using Traefik)
      - "traefik.enable=true"
      # Option 1: With custom domain (requires DNS A record)
      # - "traefik.http.routers.ffmpeg-api.rule=Host(`api.yourdomain.com`)"
      # - "traefik.http.routers.ffmpeg-api.entrypoints=websecure"
      # - "traefik.http.routers.ffmpeg-api.tls.certresolver=myresolver"
      # Option 2: With path prefix (access via http://your-ip/ffmpeg-api/)
      - "traefik.http.routers.ffmpeg-api.rule=PathPrefix(`/ffmpeg-api`)"
      - "traefik.http.routers.ffmpeg-api.entrypoints=web"
      - "traefik.http.middlewares.ffmpeg-api-strip.stripprefix.prefixes=/ffmpeg-api"
      - "traefik.http.routers.ffmpeg-api.middlewares=ffmpeg-api-strip"
      # Service configuration
      - "traefik.http.services.ffmpeg-api.loadbalancer.server.port=3000"
      - "traefik.docker.network=ai-toolkit_v2_default"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Redis Service (Job Queue & Caching)
  redis:
    image: redis:7-alpine
    container_name: ffmpeg-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ffmpeg-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru

volumes:
  redis_data:
    driver: local
  ffmpeg_temp:
    driver: local

networks:
  ffmpeg-network:
    driver: bridge
  ai-toolkit_v2_default:
    external: true  # Connect to existing Traefik network
